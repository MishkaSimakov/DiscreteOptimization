name: Run Tasks

on:
  push:

jobs:
  solve:
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: setcover
            instance: sc_157_0
          - task: setcover
            instance: sc_330_0
          - task: setcover
            instance: sc_1000_11
          - task: setcover
            instance: sc_5000_1
          - task: setcover
            instance: sc_10000_5
          - task: setcover
            instance: sc_10000_2

          - task: knapsack
            instance: ks_30_0
          - task: knapsack
            instance: ks_50_0
          - task: knapsack
            instance: ks_200_0
          - task: knapsack
            instance: ks_400_0
          - task: knapsack
            instance: ks_1000_0
          - task: knapsack
            instance: ks_10000_0

          - task: coloring
            instance: gc_50_3
          - task: coloring
            instance: gc_70_7
          - task: coloring
            instance: gc_100_5
          - task: coloring
            instance: gc_250_9
          - task: coloring
            instance: gc_500_1
          - task: coloring
            instance: gc_1000_5

          - task: tsp
            instance: tsp_51_1
          - task: tsp
            instance: tsp_100_3
          - task: tsp
            instance: tsp_200_2
          - task: tsp
            instance: tsp_574_1
          - task: tsp
            instance: tsp_1889_1
          - task: tsp
            instance: tsp_33810_1

          - task: facility
            instance: fl_25_2
          - task: facility
            instance: fl_100_1
          - task: facility
            instance: fl_200_7
          - task: facility
            instance: fl_500_7
          - task: facility
            instance: fl_1000_2
          - task: facility
            instance: fl_2000_2

          - task: vrp
            instance: vrp_16_3_1
          - task: vrp
            instance: vrp_26_8_1
          - task: vrp
            instance: vrp_51_5_1
          - task: vrp
            instance: vrp_101_10_1
          - task: vrp
            instance: vrp_200_16_1
          - task: vrp
            instance: vrp_421_41_1

    uses: ./.github/workflows/solve_instance.yml
    with:
      if: ${{ github.ref_name == 'master' || matrix.task == github.ref_name }}
      task: ${{ matrix.task }}
      instance: ${{ matrix.instance }}

  # each instance generates its own solution artifact. It is much nicer to have one merged artifact. This job does exactly this thing.
  collect-artifacts:
    runs-on: ubuntu-latest
    needs: solve

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Merge results
        run: |
          mkdir merged
          find artifacts -type f -exec cp {} merged/ \;

      - name: Upload merged artifact
        uses: actions/upload-artifact@v6
        with:
          name: all-results
          path: merged/

  generate-summary:
    runs-on: ubuntu-latest
    needs: collect-artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # library for parsing json
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: all-results
          path: artifacts

      - name: Generate summary table
        run: |
          echo "## Task Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          files=$(ls artifacts/*_stats.json 2>/dev/null || true)

          if [ -z "$files" ]; then
            echo "_No results found_" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          task_full_name() {
            case "$1" in
              sc)  echo "setcover"  ;;
              ks)  echo "knapsack"  ;;
              gc)  echo "coloring"  ;;
              tsp) echo "tsp"       ;;
              fl)  echo "facility"  ;;
              *)   echo "$1"        ;;
            esac
          }

          # Extract unique task prefixes
          tasks=$(for f in $files; do
            basename "$f" _stats.json | cut -d'_' -f1
          done | sort -u)

          for task in $tasks; do
            full=$(task_full_name "$task")
            maximize=$(jq -r --arg t "$full" '.[$t].maximize // false' data/thresholds.json 2>/dev/null || echo false)

            echo "### $full" >> $GITHUB_STEP_SUMMARY
            echo "[Compare](https://mishkasimakov.github.io/DiscreteOptimization/compare.html?commit=${GITHUB_SHA::7}&problem=$full)" >> $GITHUB_STEP_SUMMARY
            echo "| Instance | Score | Easy | Hard | Status | Duration (ms) |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|------|------|--------|---------------|" >> $GITHUB_STEP_SUMMARY

            task_files=$(ls artifacts/${task}_*_stats.json 2>/dev/null | sort -V || true)

            if [ -z "$task_files" ]; then
              echo "| (no data) | - | - | - | - | - |" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              continue
            fi

            for file in $task_files; do
              name=$(basename "$file" _stats.json)

              score=$(jq '.score' "$file")
              duration=$(jq '.duration' "$file")

              easy=$(jq -r --arg t "$full" --arg i "$name" '.[$t].instances[$i].easy // empty' data/thresholds.json 2>/dev/null)
              hard=$(jq -r --arg t "$full" --arg i "$name" '.[$t].instances[$i].hard // empty' data/thresholds.json 2>/dev/null)

              easy_disp="${easy:-—}"
              hard_disp="${hard:-—}"

              if [ -n "$score" ] && [ "$score" != "null" ] && { [ -n "$easy" ] || [ -n "$hard" ]; }; then
                status=$(awk -v s="$score" -v e="${easy:-}" -v h="${hard:-}" -v m="$maximize" 'BEGIN {
                  hard_met = (h != "" && (m == "true" ? s+0 >= h+0 : s+0 <= h+0))
                  easy_met = (e != "" && (m == "true" ? s+0 >= e+0 : s+0 <= e+0))
                  if (hard_met)      print "🟢 hard"
                  else if (easy_met) print "🟡 easy"
                  else               print "🔴 miss"
                }')
              else
                status="—"
              fi

              echo "| $name | $score | $easy_disp | $hard_disp | $status | $duration |" >> $GITHUB_STEP_SUMMARY
            done

            echo "" >> $GITHUB_STEP_SUMMARY
          done

  store-results:
    runs-on: ubuntu-latest
    needs: collect-artifacts
    permissions:
      contents: write

    steps:
      - name: Checkout repository (for scripts)
        uses: actions/checkout@v6

      - name: Checkout dashboard-data branch
        uses: actions/checkout@v6
        with:
          ref: dashboard-data
          path: dashboard-data

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: all-results
          path: artifacts
        continue-on-error: true

      - name: Append results to history
        run: python3 scripts/collect_results.py
        env:
          ARTIFACTS_DIR: artifacts
          OUTPUT_FILE: dashboard-data/history.jsonl
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}

      - name: Copy thresholds to dashboard-data
        run: cp data/thresholds.json dashboard-data/thresholds.json

      - name: Commit and push history
        run: |
          cd dashboard-data
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add history.jsonl thresholds.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "results: ${{ github.ref_name }}@$(echo '${{ github.sha }}' | cut -c1-7)"
          git pull --rebase origin dashboard-data
          git push origin dashboard-data